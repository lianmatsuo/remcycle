name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:17 UTC, against the newest Claude Code.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python ${{ matrix.python }}, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: macos-15, python: "3.12" }
          - { os: windows-2025, python: "3.12" }
          - { os: windows-2025, python: "3.14" }
          # The last Python that leaves a new folder on Windows open to the machine's other users
          # when asked to keep it to its owner. remcycle has to close the archive's folder itself there.
          - { os: windows-2025, python: "3.12.3" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # The gate is a bash script, and on Windows a step would otherwise run in PowerShell.
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: scripts/check python

  mod:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A change is checked against the oldest Claude Code that runs mods without a switch. The
      # weekly run uses the newest, so a release that changes the mods API shows up there.
      CLAUDE_CODE: ${{ github.event_name == 'schedule' && 'latest' || '2.1.287' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE"
      - run: scripts/check mod

  commits:
    # A pull request's own commits. What is already on its base branch is not checked again.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: scripts/check commits
        env:
          CHECK_BASE: origin/${{ github.base_ref }}

  gate:
    # The one result to require on main: it passes only when every job above did.
    # The commits job runs for pull requests only, so elsewhere it counts as passed.
    if: always()
    needs: [python, mod, commits]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          test "$PYTHON" = success
          test "$MOD" = success
          test "$COMMITS" = success || test "$COMMITS" = skipped
        env:
          PYTHON: ${{ needs.python.result }}
          MOD: ${{ needs.mod.result }}
          COMMITS: ${{ needs.commits.result }}
