name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:17 UTC, against the newest Claude Code.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python ${{ matrix.python }}, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: macos-14, python: "3.12" }
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: scripts/check python

  mod:
    runs-on: ubuntu-24.04
    env:
      # A change is checked against the Claude Code the mod was written against. The weekly run
      # uses the newest, because the mod API is early access and can change between releases.
      CLAUDE_CODE: ${{ github.event_name == 'schedule' && 'latest' || '2.1.286' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE"
      - run: scripts/check mod

  gate:
    # The one result to require on main: it passes only when every job above did.
    if: always()
    needs: [python, mod]
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULTS" = "success success"
        env:
          RESULTS: ${{ needs.python.result }} ${{ needs.mod.result }}
