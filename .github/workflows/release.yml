name: release

# A pushed version tag starts a release. RELEASING.md has the steps that lead up to the tag.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The tag names the version every file holds
        run: |
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          uv run --locked pytest -q tests/test_release.py
      - name: The tagged commit passed the gate
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=gate" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          test "$passed" -gt 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The changelog has the release's notes
        run: scripts/release notes "${GITHUB_REF_NAME#v}" > notes.md
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/remcycle/
    permissions:
      # PyPI takes the upload on this workflow's identity, so no token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github:
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "remcycle ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
