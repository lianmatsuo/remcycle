[project]
name = "remcycle"
version = "0.1.0"
description = "Nightly memory for Claude Code, built from its own sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Lian Matsuo" }]
dependencies = []

[project.scripts]
dream = "dream.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
